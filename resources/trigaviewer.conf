# Configuracao do TrigaViewer (/etc/trigaviewer.conf).
# Cada chave vira um argumento --chave na linha de comando do servico.
# Linhas em branco e comentarios (#) sao ignorados.

# Interface web. Use 0.0.0.0 para abrir o visualizador a outras maquinas.
host=0.0.0.0
port=8081

# TrigaServer
triga-host=127.0.0.1
triga-port=1234

# Taxa de amostragem da ponte, em milissegundos.
interval=10
