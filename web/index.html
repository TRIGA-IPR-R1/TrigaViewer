<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrigaViewer — Reator TRIGA IPR-R1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3' fill='%234cc2ff'/%3E%3Cg fill='none' stroke='%234cc2ff' stroke-width='2'%3E%3Cellipse cx='16' cy='16' rx='13' ry='6'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(120 16 16)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="3"/>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <ellipse cx="16" cy="16" rx="13" ry="6"/>
        <ellipse cx="16" cy="16" rx="13" ry="6" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="13" ry="6" transform="rotate(120 16 16)"/>
      </g>
    </svg>
    <div class="brand-text">
      <h1>TrigaViewer</h1>
      <p>Reator Nuclear TRIGA IPR-R1</p>
    </div>
  </div>

  <dl class="metrics">
    <div id="status" data-state="disconnected">
      <dt>Status</dt>
      <dd>
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Servidor Desconectado</span>
      </dd>
    </div>
    <div><dt>Amostras</dt><dd id="metric-samples">0</dd></div>
    <div><dt>Taxa</dt><dd id="metric-rate" title="Amostras gravadas no último segundo">—</dd></div>
    <div><dt>Duração</dt><dd id="metric-duration">—</dd></div>
    <div><dt>Memória</dt><dd id="metric-memory">—</dd></div>
  </dl>

  <div class="top-controls">
    <div class="field field-narrow">
      <label for="input-capacity">Memória de Amostras</label>
      <select id="input-capacity">
        <option value="10000">10 mil amostras</option>
        <option value="50000" selected>50 mil amostras</option>
        <option value="100000">100 mil amostras</option>
        <option value="250000">250 mil amostras</option>
        <option value="1000000">1 mi amostras</option>
        <option value="0">Ilimitado</option>
      </select>
    </div>
    <div class="field field-narrow">
      <label for="input-interval">Taxa de Amostragem</label>
      <select id="input-interval"></select>
    </div>
    <button type="button" class="primary" id="btn-reading">Parar Leitura</button>
    <button type="button" class="ghost danger" id="btn-clear"
            title="Descarta as amostras já salvas neste navegador">Limpar Memória</button>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-start">
    <button type="button" class="primary" id="btn-add-chart">
      <span aria-hidden="true">＋</span> Gráfico
    </button>
    <button type="button" class="primary" id="btn-add-gauge"
            title="Exibe o valor atual de uma variável em tamanho grande">
      <span aria-hidden="true">＋</span> Mostrador
    </button>
  </div>

  <div class="toolbar-end">
    <input id="input-import" type="file" accept=".csv,text/csv" hidden>
    <button type="button" class="primary" id="btn-import"
            title="Carrega um CSV na memória deste navegador">Importar CSV</button>
    <button type="button" class="ghost" id="btn-export"
            title="Baixa em CSV as variáveis dos gráficos e mostradores">Exportar CSV</button>
    <button type="button" class="ghost" id="btn-export-full"
            title="Baixa em CSV todas as variáveis da memória">Exportar CSV Completo</button>
  </div>
</div>

<main id="charts" class="charts" aria-live="polite"></main>

<section class="empty-state" id="empty-state">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <polyline points="6,34 16,22 24,28 34,12 42,18" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h2>Nenhum gráfico na tela</h2>
  <p>
    Clique em <strong>Gráfico</strong> ou <strong>Mostrador</strong> para
    escolher a variável que deseja acompanhar. A <strong>Taxa de Amostragem</strong>
    pode ser alterada com a leitura ligada.
  </p>
</section>

<template id="chart-template">
  <article class="chart-card">
    <header class="chart-head">
      <input class="chart-title" type="text" aria-label="Título do gráfico" spellcheck="false">
      <div class="chart-tools">
        <button type="button" class="tool" data-action="follow" aria-label="Acompanhar tempo real">
          tempo real
        </button>
        <button type="button" class="tool" data-action="log"
                title="Alternar escala logarítmica no eixo Y">log</button>
        <button type="button" class="tool" data-action="height"
                title="Alternar altura do gráfico">altura</button>
        <button type="button" class="tool tool-remove" data-action="remove"
                title="Remover gráfico" aria-label="Remover gráfico">×</button>
      </div>
    </header>

    <div class="chart-plot" hidden></div>

    <div class="chart-placeholder">
      <p>Selecione a variável que deseja plotar neste gráfico.</p>
      <div class="picker cascaded first-picker">
        <select class="device-select" aria-label="Dispositivo"></select>
        <select class="channel-select" aria-label="Canal"></select>
        <select class="field-select" aria-label="Variável a plotar"></select>
        <button type="button" class="primary" data-action="add-first">Plotar</button>
      </div>
    </div>

    <footer class="chart-foot" hidden>
      <ul class="series-list"></ul>
      <div class="add-series cascaded add-picker">
        <select class="device-select" aria-label="Dispositivo"></select>
        <select class="channel-select" aria-label="Canal"></select>
        <select class="field-select" aria-label="Variável a adicionar"></select>
        <button type="button" class="ghost" data-action="add-series">
          <span aria-hidden="true">＋</span> Adicionar variável
        </button>
      </div>
      <p class="unit-hint"></p>
    </footer>
  </article>
</template>

<template id="gauge-template">
  <article class="chart-card gauge-card">
    <header class="chart-head">
      <input class="chart-title" type="text" aria-label="Título do mostrador" spellcheck="false">
      <div class="chart-tools">
        <button type="button" class="tool" data-action="height"
                title="Alternar tamanho do mostrador">tamanho</button>
        <button type="button" class="tool tool-remove" data-action="remove"
                title="Remover mostrador" aria-label="Remover mostrador">×</button>
      </div>
    </header>

    <div class="gauge-placeholder">
      <p>Selecione a variável que deseja exibir neste mostrador.</p>
      <div class="picker cascaded first-picker">
        <select class="device-select" aria-label="Dispositivo"></select>
        <select class="channel-select" aria-label="Canal"></select>
        <select class="field-select" aria-label="Variável a exibir"></select>
        <button type="button" class="primary" data-action="add-first">Mostrar</button>
      </div>
    </div>

    <div class="gauge-face" hidden>
      <p class="gauge-reading">
        <span class="gauge-value">—</span>
        <span class="gauge-unit"></span>
      </p>
    </div>

    <footer class="chart-foot" hidden>
      <div class="add-series cascaded change-picker">
        <select class="device-select" aria-label="Dispositivo"></select>
        <select class="channel-select" aria-label="Canal"></select>
        <select class="field-select" aria-label="Trocar variável"></select>
      </div>
    </footer>
  </article>
</template>

<div class="bottombar">
  <div class="toolbar-group">
    <label for="input-window">Janela de tempo</label>
    <select id="input-window">
      <option value="30">30 segundos</option>
      <option value="60">1 minuto</option>
      <option value="300" selected>5 minutos</option>
      <option value="900">15 minutos</option>
      <option value="3600">1 hora</option>
      <option value="0">Tudo</option>
    </select>
  </div>
  <button type="button" class="ghost" id="btn-pause" title="Congela o desenho; os dados continuam sendo salvos">Pausar desenho</button>
</div>

<script src="vendor/uPlot.iife.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
